<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Twin Surveillance — Video Showcase</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { max-width: 1100px; margin: 0 auto; padding: 32px 20px 56px; background: #0b1020; color: #eef2ff; }
    h1 { margin-bottom: 8px; }
    p { color: #b8c1d9; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; margin-top: 28px; }
    section { padding: 16px; background: #151d33; border: 1px solid #2b3857; border-radius: 14px; }
    video { display: block; width: 100%; border-radius: 10px; background: #050812; }
    a { color: #8ab4ff; }
  </style>
</head>
<body>
  <h1>Digital Twin Surveillance</h1>
  <p>Video showcase for a private multi-camera digital-twin surveillance system.</p>
  <div class="grid">
    <section>
      <h2>2D view</h2>
      <video controls preload="metadata">
        <source src="video_2d.webm" type="video/webm">
        Your browser does not support WebM video.
      </video>
    </section>
    <section>
      <h2>3D view</h2>
      <video controls preload="metadata">
        <source src="video3d.mp4" type="video/mp4">
        Your browser does not support MP4 video.
      </video>
    </section>
  </div>
  <p><a href="README.en.md">English README</a> · <a href="README.vi.md">README tiếng Việt</a></p>
